<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — FoodDash</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { padding-top: 70px; background: #f8f9fc; }
    .cart-layout { max-width: 1100px; margin: 0 auto; padding: 28px 24px; display: flex; gap: 24px; align-items: flex-start; }
    .cart-main { flex: 1; }
    .cart-sidebar { width: 340px; flex-shrink: 0; position: sticky; top: 90px; }
    .section-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 16px; }
    .section-card-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
    /* Cart Items */
    .cart-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-img { width: 72px; height: 72px; border-radius: 12px; background: linear-gradient(135deg,#fff0e0,#ffe8f0); display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; }
    .cart-item-body { flex: 1; }
    .cart-item-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
    .cart-item-rest { font-size: 12px; color: var(--text-light); margin-bottom: 10px; }
    .cart-item-footer { display: flex; align-items: center; justify-content: space-between; }
    .cart-item-price { font-size: 16px; font-weight: 800; color: var(--primary); }
    .qty-ctrl { display: flex; align-items: center; gap: 8px; }
    .qty-b { background: #f0f4ff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary); }
    .qty-b:hover { background: var(--primary); color: white; }
    .qty-n { font-size: 15px; font-weight: 700; min-width: 24px; text-align: center; }
    .remove-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; transition: color 0.2s; }
    .remove-btn:hover { color: var(--primary); }
    /* Address */
    .address-option { display: flex; gap: 12px; padding: 14px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; }
    .address-option.selected { border-color: var(--primary); background: #fff5f5; }
    .address-icon { font-size: 24px; }
    .address-body h4 { font-size: 14px; font-weight: 700; }
    .address-body p  { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    /* Payment */
    .payment-option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; }
    .payment-option.selected { border-color: var(--primary); background: #fff5f5; }
    .payment-option input { accent-color: var(--primary); }
    .payment-icon { font-size: 22px; }
    .payment-label { font-size: 14px; font-weight: 600; }
    /* Summary */
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 12px; }
    .summary-row.total { font-size: 17px; font-weight: 800; padding-top: 12px; border-top: 2px solid var(--border); margin-top: 4px; }
    .coupon-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .coupon-row input { flex: 1; border: 2px solid var(--border); border-radius: 50px; padding: 10px 16px; font-family: inherit; font-size: 13px; outline: none; transition: all 0.3s; }
    .coupon-row input:focus { border-color: var(--primary); }
    .coupon-row button { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 50px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: 13px; }
    .place-order-btn { width: 100%; padding: 15px; background: linear-gradient(135deg,var(--primary),var(--secondary)); color: white; border: none; border-radius: 50px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .place-order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,71,87,0.4); }
    .discount-text { color: var(--accent); font-weight: 600; }
    @media(max-width:768px){ .cart-layout{flex-direction:column;} .cart-sidebar{width:100%;position:static;} }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-brand" onclick="window.location.href='../index.html'" style="cursor:pointer">
      <span class="brand-icon">🍔</span><span class="brand-name">FoodDash</span>
    </div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="orders.html" class="nav-link">My Orders</a>
      <a href="cart.html" class="nav-link cart-link active">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="login.html" class="nav-link btn-login" id="authBtn">Login</a>
    </div>
  </nav>

  <div class="cart-layout">
    <!-- Left: Cart Items + Address + Payment -->
    <div class="cart-main" id="cartMain">
      <!-- Rendered by JS -->
    </div>

    <!-- Right: Order Summary -->
    <div class="cart-sidebar" id="cartSidebar">
      <!-- Rendered by JS -->
    </div>
  </div>

  <script src="../data/restaurants.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let selectedAddress = 0;
    let selectedPayment = 'upi';
    let appliedCoupon   = null;

    const COUPONS = {
      FOODDASH40: { type: 'percent', value: 40, max: 200 },
      FIRST50:    { type: 'flat',    value: 50 },
      NEWUSER:    { type: 'percent', value: 25, max: 100 }
    };

    const ADDRESSES = [
      { icon: '🏠', label: 'Home',   addr: '123 Main Street, Sector 12, New Delhi - 110001' },
      { icon: '💼', label: 'Work',   addr: '456 Business Park, Connaught Place, New Delhi - 110002' },
      { icon: '📍', label: 'Other',  addr: 'Add a new address...' }
    ];

    document.addEventListener('DOMContentLoaded', renderCart);

    function renderCart() {
      const main    = document.getElementById('cartMain');
      const sidebar = document.getElementById('cartSidebar');

      if (!Cart.items.length) {
        main.innerHTML = `
          <div class="section-card">
            <div class="empty-state">
              <div class="empty-icon">🛒</div>
              <h3>Your cart is empty</h3>
              <p>Looks like you haven't added anything yet!</p>
              <button class="btn-primary" onclick="window.location.href='menu.html'">
                <i class="fas fa-utensils"></i> Browse Menu
              </button>
            </div>
          </div>`;
        sidebar.innerHTML = '';
        return;
      }

      // Cart items
      main.innerHTML = `
        <div class="section-card">
          <div class="section-card-title">🛒 Your Cart <span style="font-size:13px;color:var(--text-light);font-weight:400">(${Cart.count} items)</span></div>
          <div id="cartItemsList">
            ${Cart.items.map(renderCartItem).join('')}
          </div>
          <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center">
            <button onclick="Cart.clear();renderCart()" style="background:none;border:none;color:var(--primary);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">🗑️ Clear cart</button>
            <a href="menu.html" style="color:var(--primary);font-size:13px;font-weight:600;text-decoration:none">+ Add more items</a>
          </div>
        </div>

        <div class="section-card">
          <div class="section-card-title">📍 Delivery Address</div>
          ${ADDRESSES.map((a,i) => `
            <div class="address-option ${i===selectedAddress?'selected':''}" onclick="selectAddress(${i})">
              <div class="address-icon">${a.icon}</div>
              <div class="address-body">
                <h4>${a.label}</h4>
                <p>${a.addr}</p>
              </div>
            </div>`).join('')}
        </div>

        <div class="section-card">
          <div class="section-card-title">💳 Payment Method</div>
          ${[
            { id: 'upi',  icon: '📱', label: 'UPI (PhonePe / GPay / Paytm)' },
            { id: 'card', icon: '💳', label: 'Credit / Debit Card' },
            { id: 'nb',   icon: '🏦', label: 'Net Banking' },
            { id: 'cod',  icon: '💵', label: 'Cash on Delivery' }
          ].map(p => `
            <div class="payment-option ${p.id===selectedPayment?'selected':''}" onclick="selectPayment('${p.id}')">
              <input type="radio" name="payment" ${p.id===selectedPayment?'checked':''} />
              <span class="payment-icon">${p.icon}</span>
              <span class="payment-label">${p.label}</span>
            </div>`).join('')}
        </div>`;

      renderSummary();
    }

    function renderCartItem(item) {
      return `
        <div class="cart-item" id="ci-${item.id}">
          <div class="cart-item-img">${item.emoji}</div>
          <div class="cart-item-body">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-rest">${item.restaurant}</div>
            <div class="cart-item-footer">
              <span class="cart-item-price">₹${item.price * item.qty}</span>
              <div style="display:flex;align-items:center;gap:10px">
                <div class="qty-ctrl">
                  <button class="qty-b" onclick="cartChangeQty(${item.id},-1)">−</button>
                  <span class="qty-n" id="cqty-${item.id}">${item.qty}</span>
                  <button class="qty-b" onclick="cartChangeQty(${item.id},1)">+</button>
                </div>
                <button class="remove-btn" onclick="cartRemove(${item.id})"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderSummary() {
      const discount  = calcDiscount();
      const subtotal  = Cart.subtotal;
      const delivery  = subtotal > 499 ? 0 : 29;
      const taxes     = Math.round((subtotal - discount) * 0.05);
      const total     = subtotal - discount + delivery + taxes;

      document.getElementById('cartSidebar').innerHTML = `
        <div class="section-card">
          <div class="section-card-title">🧾 Order Summary</div>
          <div class="coupon-row">
            <input type="text" id="couponInput" placeholder="Enter coupon code" style="text-transform:uppercase"/>
            <button onclick="applyCoupon()">Apply</button>
          </div>
          ${appliedCoupon ? `<div style="background:#e8f8f0;color:#27ae60;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px">✅ Coupon "${appliedCoupon}" applied!</div>` : ''}
          <div class="summary-row"><span>Subtotal</span><span>₹${subtotal}</span></div>
          ${discount > 0 ? `<div class="summary-row"><span>Discount</span><span class="discount-text">−₹${discount}</span></div>` : ''}
          <div class="summary-row"><span>Delivery Fee</span><span>${delivery === 0 ? '<span style="color:#27ae60;font-weight:600">FREE</span>' : '₹'+delivery}</span></div>
          <div class="summary-row"><span>GST (5%)</span><span>₹${taxes}</span></div>
          <div class="summary-row total"><span>Total</span><span>₹${total}</span></div>
          ${subtotal < 499 ? `<p style="font-size:12px;color:var(--text-light);margin-bottom:14px">Add ₹${499-subtotal} more for free delivery!</p>` : ''}
          <button class="place-order-btn" onclick="placeOrder(${total})">
            <i class="fas fa-check-circle"></i> Place Order · ₹${total}
          </button>
          <p style="text-align:center;font-size:12px;color:var(--text-light);margin-top:10px">🔒 100% Secure Payment</p>
        </div>`;
    }

    function calcDiscount() {
      if (!appliedCoupon || !COUPONS[appliedCoupon]) return 0;
      const c = COUPONS[appliedCoupon];
      if (c.type === 'flat') return Math.min(c.value, Cart.subtotal);
      if (c.type === 'percent') return Math.min(Math.round(Cart.subtotal * c.value / 100), c.max || Infinity);
      return 0;
    }

    function cartChangeQty(id, delta) {
      const item = Cart.items.find(i => i.id === id);
      Cart.updateQty(id, (item?.qty || 0) + delta);
      renderCart();
    }

    function cartRemove(id) {
      Cart.remove(id);
      renderCart();
      Toast.show('Item removed from cart', 'info');
    }

    function selectAddress(i) {
      selectedAddress = i;
      renderCart();
    }

    function selectPayment(id) {
      selectedPayment = id;
      renderCart();
    }

    function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      if (!code) return;
      if (COUPONS[code]) {
        appliedCoupon = code;
        Toast.show('Coupon applied! 🎉', 'success');
      } else {
        Toast.show('Invalid coupon code', 'error');
      }
      renderSummary();
    }

    function placeOrder(total) {
      const user = Auth.getUser();
      if (!user) {
        Toast.show('Please login to place an order', 'error');
        setTimeout(() => window.location.href = 'login.html', 1000);
        return;
      }
      const order = {
        id: generateOrderId(),
        items: [...Cart.items],
        total,
        payment: selectedPayment,
        address: ADDRESSES[selectedAddress].addr,
        status: 'confirmed',
        placedAt: new Date().toISOString(),
        restaurant: Cart.items[0]?.restaurant || 'FoodDash',
        estimatedTime: 35
      };
      saveOrder(order);
      Cart.clear();
      Toast.show('Order placed successfully! 🎉', 'success');
      setTimeout(() => window.location.href = `tracking.html?id=${order.id}`, 1200);
    }
  </script>
</body>
</html>
