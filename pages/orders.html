<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders — FoodDash</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { padding-top: 70px; background: #f8f9fc; }
    .orders-layout { max-width: 860px; margin: 0 auto; padding: 28px 24px; }
    .page-title { font-size: 28px; font-weight: 800; margin-bottom: 24px; }
    .order-tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
    .order-tab { background: white; border: 2px solid var(--border); padding: 8px 18px; border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .order-tab.active { border-color: var(--primary); color: var(--primary); background: #fff5f5; }
    .order-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; transition: all 0.3s; }
    .order-card:hover { box-shadow: var(--shadow-hover); }
    .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .order-card-id { font-size: 13px; font-weight: 700; color: var(--text-light); }
    .order-card-rest { font-size: 16px; font-weight: 800; }
    .order-card-date { font-size: 12px; color: var(--text-light); }
    .order-status-badge { padding: 5px 14px; border-radius: 50px; font-size: 12px; font-weight: 700; }
    .status-delivered  { background: #e8f8f0; color: #27ae60; }
    .status-confirmed  { background: #fff8e1; color: #f39c12; }
    .status-cancelled  { background: #ffeaea; color: var(--primary); }
    .status-preparing  { background: #e8f0ff; color: #5c6bc0; }
    .order-items-preview { padding: 14px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .order-preview-item { display: flex; align-items: center; gap: 6px; background: #f8f9fc; padding: 6px 12px; border-radius: 50px; font-size: 13px; }
    .order-card-footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .order-total { font-size: 18px; font-weight: 800; color: var(--dark); }
    .order-footer-actions { display: flex; gap: 10px; }
    .btn-reorder { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 9px 20px; border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .btn-reorder:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255,71,87,0.3); }
    .btn-track { background: white; border: 2px solid var(--primary); color: var(--primary); padding: 8px 18px; border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .btn-track:hover { background: var(--primary); color: white; }
    .demo-orders-btn { text-align: center; margin-bottom: 24px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-brand" onclick="window.location.href='../index.html'" style="cursor:pointer">
      <span class="brand-icon">🍔</span><span class="brand-name">FoodDash</span>
    </div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="orders.html" class="nav-link active">My Orders</a>
      <a href="cart.html" class="nav-link cart-link">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="login.html" class="nav-link btn-login" id="authBtn">Login</a>
    </div>
  </nav>

  <div class="orders-layout">
    <h1 class="page-title">📋 My Orders</h1>
    <div class="order-tabs">
      <button class="order-tab active" onclick="filterOrders('all',this)">All Orders</button>
      <button class="order-tab" onclick="filterOrders('delivered',this)">Delivered</button>
      <button class="order-tab" onclick="filterOrders('confirmed',this)">Active</button>
      <button class="order-tab" onclick="filterOrders('cancelled',this)">Cancelled</button>
    </div>
    <div class="demo-orders-btn">
      <button class="btn-secondary" onclick="addDemoOrders()">Add Demo Orders (for testing)</button>
    </div>
    <div id="ordersList"></div>
  </div>

  <script src="../data/restaurants.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', renderOrders);

    function renderOrders() {
      const orders = getOrders();
      const list = document.getElementById('ordersList');
      const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);

      if (!filtered.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <h3>No orders yet</h3>
            <p>You haven't placed any orders. Let's fix that!</p>
            <button class="btn-primary" onclick="window.location.href='menu.html'">
              <i class="fas fa-utensils"></i> Browse Menu
            </button>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(order => renderOrderCard(order)).join('');
    }

    function renderOrderCard(order) {
      const date    = new Date(order.placedAt).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      const statusClass = { delivered:'status-delivered', confirmed:'status-confirmed', cancelled:'status-cancelled', preparing:'status-preparing' }[order.status] || 'status-confirmed';
      const statusLabel = { delivered:'✅ Delivered', confirmed:'⏳ Active', cancelled:'❌ Cancelled', preparing:'👨‍🍳 Preparing' }[order.status] || order.status;

      return `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <div class="order-card-id">#${order.id}</div>
              <div class="order-card-rest">${order.restaurant}</div>
              <div class="order-card-date">${date}</div>
            </div>
            <span class="order-status-badge ${statusClass}">${statusLabel}</span>
          </div>
          <div class="order-items-preview">
            ${(order.items || []).slice(0,4).map(i => `
              <div class="order-preview-item">
                <span>${i.emoji}</span>
                <span>${i.name}</span>
                <span style="color:var(--text-light)">×${i.qty}</span>
              </div>`).join('')}
            ${(order.items || []).length > 4 ? `<div class="order-preview-item" style="color:var(--text-light)">+${order.items.length-4} more</div>` : ''}
          </div>
          <div class="order-card-footer">
            <div class="order-total">₹${order.total} <span style="font-size:12px;color:var(--text-light);font-weight:400">· ${(order.items||[]).reduce((s,i)=>s+i.qty,0)} items</span></div>
            <div class="order-footer-actions">
              ${order.status !== 'delivered' && order.status !== 'cancelled'
                ? `<button class="btn-track" onclick="window.location.href='tracking.html?id=${order.id}'">Track Order</button>`
                : ''}
              <button class="btn-reorder" onclick="reorder('${order.id}')">🔄 Reorder</button>
            </div>
          </div>
        </div>`;
    }

    function filterOrders(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    function reorder(orderId) {
      const order = getOrders().find(o => o.id === orderId);
      if (!order) return;
      (order.items || []).forEach(item => Cart.add(item));
      Toast.show('Items added to cart! 🛒', 'success');
      setTimeout(() => window.location.href = 'cart.html', 1000);
    }

    function addDemoOrders() {
      const demos = [
        {
          id: 'FDDEMO001', restaurant: 'Pizza Palace', status: 'delivered', total: 748,
          placedAt: new Date(Date.now() - 86400000).toISOString(), payment: 'upi',
          items: [
            { id: 101, name: 'Margherita Pizza', emoji: '🍕', price: 299, qty: 1, restaurant: 'Pizza Palace' },
            { id: 105, name: 'Garlic Bread',     emoji: '🥖', price: 99,  qty: 1, restaurant: 'Pizza Palace' },
            { id: 106, name: 'Tiramisu',          emoji: '🍰', price: 149, qty: 2, restaurant: 'Pizza Palace' }
          ]
        },
        {
          id: 'FDDEMO002', restaurant: 'Biryani Bazaar', status: 'confirmed', total: 428,
          placedAt: new Date().toISOString(), payment: 'cod',
          items: [
            { id: 601, name: 'Chicken Biryani', emoji: '🍛', price: 349, qty: 1, restaurant: 'Biryani Bazaar' },
            { id: 604, name: 'Raita',           emoji: '🥣', price: 49,  qty: 1, restaurant: 'Biryani Bazaar' }
          ]
        }
      ];
      const orders = getOrders();
      demos.forEach(d => { if (!orders.find(o => o.id === d.id)) orders.push(d); });
      localStorage.setItem('fd_orders', JSON.stringify(orders));
      renderOrders();
      Toast.show('Demo orders added!', 'success');
    }
  </script>
</body>
</html>
