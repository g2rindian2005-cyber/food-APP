<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu — FoodDash</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { padding-top: 70px; background: #f8f9fc; }
    .menu-layout { display: flex; min-height: calc(100vh - 70px); max-width: 1280px; margin: 0 auto; padding: 24px; gap: 24px; }
    /* Sidebar */
    .sidebar { width: 260px; flex-shrink: 0; }
    .sidebar-card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .sidebar-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-light); margin-bottom: 14px; }
    .filter-option { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    .filter-option:hover { background: #fff5f5; color: var(--primary); }
    .filter-option input[type=checkbox] { accent-color: var(--primary); width: 15px; height: 15px; }
    .price-range input[type=range] { width: 100%; accent-color: var(--primary); }
    .price-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-top: 6px; }
    /* Main Content */
    .menu-main { flex: 1; }
    .menu-search-bar { background: white; border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .menu-search-bar input { flex: 1; border: 2px solid var(--border); border-radius: 50px; padding: 10px 16px; font-family: inherit; font-size: 14px; outline: none; transition: all 0.3s; }
    .menu-search-bar input:focus { border-color: var(--primary); }
    .sort-select { border: 2px solid var(--border); border-radius: 50px; padding: 9px 14px; font-family: inherit; font-size: 13px; outline: none; cursor: pointer; }
    .rest-header { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 20px; display: none; }
    .rest-header.show { display: block; }
    .rest-header-banner { height: 160px; background: linear-gradient(135deg, #fff5f5, #fff8e8); display: flex; align-items: center; justify-content: center; font-size: 80px; }
    .rest-header-info { padding: 20px; }
    .rest-header-info h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .rest-meta-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: var(--text-light); }
    .rest-meta-row span { display: flex; align-items: center; gap: 5px; }
    .menu-categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
    .menu-categories-bar::-webkit-scrollbar { display: none; }
    .menu-cat-btn { flex-shrink: 0; background: white; border: 2px solid var(--border); padding: 7px 16px; border-radius: 50px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .menu-cat-btn.active, .menu-cat-btn:hover { border-color: var(--primary); color: var(--primary); background: #fff5f5; }
    .menu-section-title { font-size: 18px; font-weight: 700; margin: 24px 0 14px; color: var(--dark); border-left: 4px solid var(--primary); padding-left: 12px; }
    .menu-items-list { display: flex; flex-direction: column; gap: 12px; }
    .menu-item { background: white; border-radius: var(--radius); padding: 16px; display: flex; gap: 16px; box-shadow: var(--shadow); transition: all 0.3s; }
    .menu-item:hover { box-shadow: var(--shadow-hover); }
    .menu-item-img { width: 96px; height: 96px; border-radius: 12px; background: linear-gradient(135deg,#fff0e0,#ffe8f0); display: flex; align-items: center; justify-content: center; font-size: 48px; flex-shrink: 0; }
    .menu-item-body { flex: 1; }
    .menu-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .menu-item-name { font-size: 16px; font-weight: 700; }
    .veg-icon { width: 18px; height: 18px; border: 2px solid; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .veg-icon.veg { border-color: #27ae60; }
    .veg-icon.veg::after { content: '●'; color: #27ae60; font-size: 10px; }
    .veg-icon.nonveg { border-color: var(--primary); }
    .veg-icon.nonveg::after { content: '●'; color: var(--primary); font-size: 10px; }
    .menu-item-desc { font-size: 13px; color: var(--text-light); line-height: 1.5; margin-bottom: 10px; }
    .menu-item-footer { display: flex; align-items: center; justify-content: space-between; }
    .menu-item-price { font-size: 18px; font-weight: 800; color: var(--dark); }
    .menu-item-original { font-size: 13px; color: var(--text-light); text-decoration: line-through; margin-left: 6px; }
    .qty-control { display: flex; align-items: center; gap: 10px; background: #fff5f5; border-radius: 50px; padding: 4px 12px; }
    .qty-btn { background: var(--primary); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .qty-btn:hover { background: var(--primary-dark); transform: scale(1.1); }
    .qty-num { font-size: 15px; font-weight: 700; min-width: 20px; text-align: center; }
    .add-btn-wrap { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 50px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .add-btn-wrap:hover { background: var(--primary-dark); transform: scale(1.04); }
    .bestseller-tag { background: #fff3cd; color: #856404; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 50px; }
    /* Floating Cart */
    .float-cart { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 16px 28px; border-radius: 50px; display: none; align-items: center; gap: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 100; cursor: pointer; transition: all 0.3s; animation: fadeUp 0.4s ease; }
    .float-cart.show { display: flex; }
    .float-cart:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
    .float-cart-info { font-size: 14px; }
    .float-cart-count { font-weight: 700; }
    .float-cart-total { font-size: 16px; font-weight: 800; color: var(--secondary); }
    .float-cart-btn { background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 50px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    @media(max-width:768px){ .sidebar{display:none;} .menu-layout{padding:12px;} }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-brand" onclick="window.location.href='../index.html'" style="cursor:pointer">
      <span class="brand-icon">🍔</span><span class="brand-name">FoodDash</span>
    </div>
    <div class="nav-search">
      <input type="text" id="globalSearch" placeholder="Search food or restaurants..." autocomplete="off"/>
      <button class="search-btn"><i class="fas fa-search"></i></button>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="nav-links">
      <a href="../index.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link active">Menu</a>
      <a href="orders.html" class="nav-link">My Orders</a>
      <a href="cart.html" class="nav-link cart-link">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <a href="login.html" class="nav-link btn-login" id="authBtn">Login</a>
    </div>
    <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
  </nav>

  <div class="menu-layout">
    <!-- Sidebar Filters -->
    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">Cuisine</div>
        <div id="cuisineFilters"></div>
      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">Food Type</div>
        <label class="filter-option"><input type="checkbox" id="vegOnly" onchange="applyFilters()"/> Veg Only</label>
        <label class="filter-option"><input type="checkbox" id="bestOnly" onchange="applyFilters()"/> Bestsellers</label>
      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">Max Price</div>
        <div class="price-range">
          <input type="range" id="priceRange" min="50" max="1000" value="1000" oninput="updatePrice(this)"/>
          <div class="price-labels"><span>₹50</span><span id="priceVal">₹1000</span></div>
        </div>
      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">Rating</div>
        <label class="filter-option"><input type="radio" name="rating" value="0" checked onchange="applyFilters()"/> All</label>
        <label class="filter-option"><input type="radio" name="rating" value="4" onchange="applyFilters()"/> 4+ ⭐</label>
        <label class="filter-option"><input type="radio" name="rating" value="4.5" onchange="applyFilters()"/> 4.5+ ⭐</label>
      </div>
    </aside>

    <!-- Main -->
    <main class="menu-main">
      <div class="menu-search-bar">
        <i class="fas fa-search" style="color:var(--text-light)"></i>
        <input type="text" id="menuSearch" placeholder="Search dishes..." oninput="filterMenu()"/>
        <select class="sort-select" id="sortBy" onchange="filterMenu()">
          <option value="default">Sort By</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>

      <!-- Restaurant Header (shown when viewing specific restaurant) -->
      <div class="rest-header" id="restHeader"></div>

      <!-- Restaurant List (all restaurants) -->
      <div id="allRestaurants"></div>

      <!-- Menu Items (single restaurant view) -->
      <div id="singleRestMenu" style="display:none">
        <div class="menu-categories-bar" id="menuCatsBar"></div>
        <div id="menuItemsContainer"></div>
      </div>
    </main>
  </div>

  <!-- Floating Cart -->
  <div class="float-cart" id="floatCart" onclick="window.location.href='cart.html'">
    <div class="float-cart-info">
      <span class="float-cart-count" id="floatCount">0 items</span> in cart
    </div>
    <span class="float-cart-total" id="floatTotal">₹0</span>
    <button class="float-cart-btn">View Cart →</button>
  </div>

  <script src="../data/restaurants.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const params   = new URLSearchParams(window.location.search);
    const restId   = params.get('rest') ? parseInt(params.get('rest')) : null;
    let currentRest = null;
    let activeCategory = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      buildCuisineFilters();
      if (restId) {
        currentRest = RESTAURANTS.find(r => r.id === restId);
        if (currentRest) showSingleRestaurant(currentRest);
        else showAllRestaurants();
      } else {
        showAllRestaurants();
      }
      updateFloatCart();
    });

    function buildCuisineFilters() {
      const cuisines = [...new Set(RESTAURANTS.flatMap(r => r.cuisine))];
      document.getElementById('cuisineFilters').innerHTML = cuisines.map(c =>
        `<label class="filter-option"><input type="checkbox" value="${c}" class="cuisine-cb" onchange="applyFilters()"/> ${c}</label>`
      ).join('');
    }

    function showAllRestaurants() {
      document.getElementById('singleRestMenu').style.display = 'none';
      document.getElementById('allRestaurants').style.display = 'block';
      renderAllRestaurants(RESTAURANTS);
    }

    function renderAllRestaurants(list) {
      const container = document.getElementById('allRestaurants');
      if (!list.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>No restaurants found</h3><p>Try different filters</p></div>`;
        return;
      }
      container.innerHTML = list.map(r => `
        <div style="background:white;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;cursor:pointer;transition:all 0.3s" onclick="showSingleRestaurant(RESTAURANTS.find(x=>x.id==${r.id}))" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform=''">
          <div style="height:160px;overflow:hidden;position:relative">
            <img
              src="${r.image}"
              alt="${r.name}"
              style="width:100%;height:100%;object-fit:cover;display:block"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            />
            <div style="display:none;height:160px;background:linear-gradient(135deg,#fff5f5,#fff8e8);align-items:center;justify-content:center;font-size:64px">${r.emoji}</div>
            ${r.badge ? `<div style="position:absolute;top:10px;left:10px;background:#2ed573;color:white;font-size:11px;font-weight:700;padding:4px 10px;border-radius:50px">${r.badge}</div>` : ''}
          </div>
          <div style="padding:16px">
            <div style="font-size:17px;font-weight:700;margin-bottom:6px">${r.name}</div>
            <div style="display:flex;gap:16px;font-size:13px;color:var(--text-light);margin-bottom:8px;flex-wrap:wrap">
              <span>⭐ ${r.rating} (${r.reviews.toLocaleString()})</span>
              <span>🕐 ${r.deliveryTime} min</span>
              <span>🛵 ₹${r.deliveryFee} delivery</span>
              <span>📦 Min ₹${r.minOrder}</span>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </div>
      `).join('');
    }

    function showSingleRestaurant(rest) {
      if (!rest) return;
      currentRest = rest;
      history.pushState({}, '', `?rest=${rest.id}`);
      document.getElementById('allRestaurants').style.display = 'none';
      document.getElementById('singleRestMenu').style.display  = 'block';

      // Header
      const hdr = document.getElementById('restHeader');
      hdr.classList.add('show');
      hdr.innerHTML = `
        <div class="rest-header-banner" style="position:relative;height:200px;overflow:hidden">
          <img
            src="${rest.image}"
            alt="${rest.name}"
            style="width:100%;height:100%;object-fit:cover;display:block"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          />
          <div style="display:none;height:200px;background:linear-gradient(135deg,#fff5f5,#fff8e8);align-items:center;justify-content:center;font-size:80px">${rest.emoji}</div>
          <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.45),transparent)"></div>
          <div style="position:absolute;bottom:14px;left:20px;color:white;font-size:28px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,0.5)">${rest.name}</div>
        </div>
        <div class="rest-header-info">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <h2 style="display:none">${rest.name}</h2>
            <button onclick="showAllRestaurants()" style="background:none;border:2px solid var(--border);padding:8px 16px;border-radius:50px;cursor:pointer;font-family:inherit;font-weight:600;font-size:13px">← All Restaurants</button>
          </div>
          <p style="color:var(--text-light);margin:6px 0 12px">${rest.description}</p>
          <div class="rest-meta-row">
            <span>⭐ ${rest.rating} (${rest.reviews.toLocaleString()} reviews)</span>
            <span>🕐 ${rest.deliveryTime} min</span>
            <span>🛵 ₹${rest.deliveryFee} delivery fee</span>
            <span>📦 Min order ₹${rest.minOrder}</span>
          </div>
        </div>`;

      // Categories
      const cats = ['All', ...new Set(rest.menu.map(m => m.category))];
      document.getElementById('menuCatsBar').innerHTML = cats.map(c =>
        `<button class="menu-cat-btn ${c==='All'?'active':''}" onclick="setMenuCat('${c}', this)">${c}</button>`
      ).join('');

      renderMenuItems(rest.menu);
    }

    function setMenuCat(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.menu-cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterMenu();
    }

    function filterMenu() {
      if (!currentRest) { applyFilters(); return; }
      const q       = (document.getElementById('menuSearch').value || '').toLowerCase();
      const vegOnly = document.getElementById('vegOnly').checked;
      const bestOnly= document.getElementById('bestOnly').checked;
      const maxPrice= parseInt(document.getElementById('priceRange').value);
      const sort    = document.getElementById('sortBy').value;

      let items = currentRest.menu.filter(item => {
        if (activeCategory !== 'All' && item.category !== activeCategory) return false;
        if (q && !item.name.toLowerCase().includes(q)) return false;
        if (vegOnly && !item.veg) return false;
        if (bestOnly && !item.bestseller) return false;
        if (item.price > maxPrice) return false;
        return true;
      });

      if (sort === 'price-asc')  items.sort((a,b) => a.price - b.price);
      if (sort === 'price-desc') items.sort((a,b) => b.price - a.price);
      if (sort === 'rating')     items.sort((a,b) => b.rating - a.rating);

      renderMenuItems(items);
    }

    function applyFilters() {
      if (currentRest) { filterMenu(); return; }
      const selected = [...document.querySelectorAll('.cuisine-cb:checked')].map(c => c.value);
      const minRating= parseFloat(document.querySelector('input[name=rating]:checked').value);
      let list = RESTAURANTS.filter(r => {
        if (selected.length && !r.cuisine.some(c => selected.includes(c))) return false;
        if (r.rating < minRating) return false;
        return true;
      });
      renderAllRestaurants(list);
    }

    function updatePrice(el) {
      document.getElementById('priceVal').textContent = '₹' + el.value;
      filterMenu();
    }

    function renderMenuItems(items) {
      const container = document.getElementById('menuItemsContainer');
      if (!items.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🍽️</div><h3>No items found</h3><p>Try adjusting your filters</p></div>`;
        return;
      }
      const grouped = {};
      items.forEach(item => {
        if (!grouped[item.category]) grouped[item.category] = [];
        grouped[item.category].push(item);
      });
      container.innerHTML = Object.entries(grouped).map(([cat, catItems]) => `
        <div class="menu-section-title">${cat}</div>
        <div class="menu-items-list">
          ${catItems.map(item => renderMenuItem(item)).join('')}
        </div>
      `).join('');
    }

    function renderMenuItem(item) {
      const qty = getItemQty(item.id);
      return `
        <div class="menu-item" id="mi-${item.id}">
          <div class="menu-item-img" style="overflow:hidden;background:#f5f5f5">
            <img
              src="${item.image}"
              alt="${item.name}"
              style="width:100%;height:100%;object-fit:cover;border-radius:12px;display:block"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            />
            <div style="display:none;width:96px;height:96px;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#fff0e0,#ffe8f0);border-radius:12px">${item.emoji}</div>
          </div>
          <div class="menu-item-body">
            <div class="menu-item-header">
              <div>
                <span class="veg-icon ${item.veg?'veg':'nonveg'}"></span>
                <span class="menu-item-name">${item.name}</span>
                ${item.bestseller ? '<span class="bestseller-tag" style="margin-left:8px">🔥 Bestseller</span>' : ''}
              </div>
              <div style="text-align:right">
                <span class="menu-item-price">₹${item.price}</span>
                <span class="menu-item-original">₹${item.originalPrice}</span>
              </div>
            </div>
            <div class="menu-item-desc">${item.description}</div>
            <div class="menu-item-footer">
              <span style="font-size:12px;color:var(--text-light)">⭐ ${item.rating}</span>
              ${qty > 0
                ? `<div class="qty-control">
                    <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                    <span class="qty-num" id="qty-${item.id}">${qty}</span>
                    <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                  </div>`
                : `<button class="add-btn-wrap" onclick="addToCartMenu(${item.id})">ADD +</button>`
              }
            </div>
          </div>
        </div>`;
    }

    function getItemQty(id) {
      const item = Cart.items.find(i => i.id === id);
      return item ? item.qty : 0;
    }

    function addToCartMenu(itemId) {
      if (!currentRest) return;
      const item = currentRest.menu.find(m => m.id === itemId);
      if (!item) return;
      Cart.add({ id: item.id, name: item.name, emoji: item.emoji, price: item.price, restaurant: currentRest.name, restId: currentRest.id });
      // Re-render just that item
      const el = document.getElementById(`mi-${itemId}`);
      if (el) el.outerHTML = renderMenuItem(item);
      updateFloatCart();
    }

    function changeQty(itemId, delta) {
      if (!currentRest) return;
      const item = currentRest.menu.find(m => m.id === itemId);
      const current = getItemQty(itemId);
      const newQty  = current + delta;
      Cart.updateQty(itemId, newQty);
      const el = document.getElementById(`mi-${itemId}`);
      if (el && item) el.outerHTML = renderMenuItem(item);
      updateFloatCart();
    }

    function updateFloatCart() {
      const fc = document.getElementById('floatCart');
      const count = Cart.count;
      if (count > 0) {
        fc.classList.add('show');
        document.getElementById('floatCount').textContent = count + ' item' + (count > 1 ? 's' : '');
        document.getElementById('floatTotal').textContent = '₹' + Cart.subtotal;
      } else {
        fc.classList.remove('show');
      }
    }
  </script>
</body>
</html>
